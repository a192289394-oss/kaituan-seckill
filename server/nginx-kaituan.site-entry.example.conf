# OPTIONAL / EXAMPLE_LIVE_ONLY mode — site-entry + auth_request
# Not the default install path. Prefer nginx-kaituan.example.conf (independent login).
# Put the real USER token in a 0600 include file; never commit it.
# Placeholder only: <USER_TOKEN_FROM_SECRET_FILE> <GATEWAY_HOST> <PORT> <AUTH_REQUEST_URI>

# include /etc/nginx/snippets/kaituan-user-bearer.conf;  # contains: proxy_set_header Authorization "Bearer …";

server {
    listen 443 ssl http2;
    server_name <GATEWAY_HOST>;

    location = /kaituan { return 301 /kaituan/; }

    location ^~ /kaituan/api/worker/ {
        auth_request off;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:<PORT>/api/worker/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location /kaituan/ {
        auth_request <AUTH_REQUEST_URI>;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:<PORT>/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Inject operator USER token from 0600 secret include — placeholder only:
        proxy_set_header Authorization "Bearer <USER_TOKEN_FROM_SECRET_FILE>";
        proxy_read_timeout 30s;
    }
}
