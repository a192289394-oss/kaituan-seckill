# nginx-kaituan.example.conf — independent login (DEFAULT)
# Placeholders: <GATEWAY_HOST> <PORT> (gateway listens 127.0.0.1 only)
# Do NOT inject Authorization. Tokens never belong in nginx for this mode.
# If you change the /kaituan/ prefix, also change GATEWAY_COOKIE_PATH and Mac --server.

server {
    listen 80;
    server_name <GATEWAY_HOST>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <GATEWAY_HOST>;

    ssl_certificate     /etc/letsencrypt/live/<GATEWAY_HOST>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<GATEWAY_HOST>/privkey.pem;

    # Force trailing slash so the SPA resolves api/ correctly
    location = /kaituan {
        return 301 /kaituan/;
    }

    location /kaituan/ {
        client_max_body_size 64k;
        # Trailing slash on proxy_pass strips the /kaituan/ prefix
        proxy_pass http://127.0.0.1:<PORT>/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through client Authorization / Cookie unchanged; do not set Bearer here
        proxy_read_timeout 30s;
    }
}
